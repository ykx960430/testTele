name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

env:
  VS_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
  QT: '6.11.2'
  Platform: x64

jobs:
  preflight:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: none
          fetch-depth: 0

      - name: Clone submodules
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          git config --global --unset-all url.https://ghproxy.net/https://github.com/.insteadOf 2>/dev/null || true

          clone_if_missing() {
            local path="$1" url="$2" marker="$3"
            marker="${marker:-CMakeLists.txt}"
            if [ ! -f "$path/$marker" ]; then
              rm -rf "$path"
              echo "Cloning $url -> $path"
              git clone --depth 1 "$url" "$path"
            else
              echo "Already exists: $path"
            fi
          }

          mkdir -p Telegram/ThirdParty

          clone_if_missing "cmake" "https://github.com/desktop-app/cmake_helpers.git" "version.cmake"

          clone_if_missing "Telegram/lib_crl"        "https://github.com/desktop-app/lib_crl.git"
          clone_if_missing "Telegram/lib_rpl"        "https://github.com/desktop-app/lib_rpl.git"
          clone_if_missing "Telegram/lib_base"       "https://github.com/desktop-app/lib_base.git"
          clone_if_missing "Telegram/lib_ui"         "https://github.com/AyuGram/lib_ui.git"
          clone_if_missing "Telegram/lib_tl"         "https://github.com/AyuGram/lib_tl.git"
          clone_if_missing "Telegram/lib_spellcheck" "https://github.com/desktop-app/lib_spellcheck.git"
          clone_if_missing "Telegram/lib_storage"    "https://github.com/desktop-app/lib_storage.git"
          clone_if_missing "Telegram/lib_lottie"     "https://github.com/desktop-app/lib_lottie.git"
          clone_if_missing "Telegram/lib_qr"         "https://github.com/desktop-app/lib_qr.git"
          clone_if_missing "Telegram/lib_translate"  "https://github.com/desktop-app/lib_translate.git"
          clone_if_missing "Telegram/lib_webrtc"     "https://github.com/desktop-app/lib_webrtc.git"
          clone_if_missing "Telegram/lib_webview"    "https://github.com/desktop-app/lib_webview.git"
          clone_if_missing "Telegram/lib_icu"        "https://github.com/AyuGram/lib_icu.git"
          clone_if_missing "Telegram/codegen"        "https://github.com/AyuGram/codegen.git"

          clone_if_missing "Telegram/ThirdParty/cmark-gfm" "https://github.com/desktop-app/cmark-gfm.git" ".git"
          clone_if_missing "Telegram/ThirdParty/libcbor"   "https://github.com/PJK/libcbor.git"            ".git"
          clone_if_missing "Telegram/ThirdParty/libfido2"  "https://github.com/Yubico/libfido2.git"         ".git"
          clone_if_missing "Telegram/ThirdParty/GSL"       "https://github.com/Microsoft/GSL.git"           ".git"
          clone_if_missing "Telegram/ThirdParty/xxHash"    "https://github.com/Cyan4973/xxHash.git"        ".git"
          clone_if_missing "Telegram/ThirdParty/lz4"       "https://github.com/lz4/lz4.git"                 ".git"
          clone_if_missing "Telegram/ThirdParty/patches"   "https://github.com/desktop-app/patches.git"     ".git"

          errors=0
          for f in \
            cmake/version.cmake cmake/validate_special_target.cmake \
            Telegram/lib_base/CMakeLists.txt Telegram/lib_ui/CMakeLists.txt \
            Telegram/lib_tl/CMakeLists.txt Telegram/codegen/CMakeLists.txt \
            Telegram/ThirdParty/cmark-gfm/.git Telegram/ThirdParty/libcbor/.git; do
            if [ -e "$f" ]; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              errors=$((errors+1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "Preflight FAILED: $errors missing submodule(s)"
            exit 1
          fi
          echo "Preflight PASSED"

  build:
    needs: preflight
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: none
          fetch-depth: 0

      - name: Clone submodules
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --unset-all url.https://ghproxy.net/https://github.com/.insteadOf 2>/dev/null || true

          clone_if_missing() {
            local path="$1" url="$2" marker="$3"
            marker="${marker:-CMakeLists.txt}"
            if [ ! -f "$path/$marker" ]; then
              rm -rf "$path"
              echo "Cloning $url -> $path"
              git clone --depth 1 "$url" "$path"
            else
              echo "Already exists: $path"
            fi
          }

          mkdir -p Telegram/ThirdParty

          clone_if_missing "cmake" "https://github.com/desktop-app/cmake_helpers.git" "version.cmake"

          clone_if_missing "Telegram/lib_crl"        "https://github.com/desktop-app/lib_crl.git"
          clone_if_missing "Telegram/lib_rpl"        "https://github.com/desktop-app/lib_rpl.git"
          clone_if_missing "Telegram/lib_base"       "https://github.com/desktop-app/lib_base.git"
          clone_if_missing "Telegram/lib_ui"         "https://github.com/AyuGram/lib_ui.git"
          clone_if_missing "Telegram/lib_tl"         "https://github.com/AyuGram/lib_tl.git"
          clone_if_missing "Telegram/lib_spellcheck" "https://github.com/desktop-app/lib_spellcheck.git"
          clone_if_missing "Telegram/lib_storage"    "https://github.com/desktop-app/lib_storage.git"
          clone_if_missing "Telegram/lib_lottie"     "https://github.com/desktop-app/lib_lottie.git"
          clone_if_missing "Telegram/lib_qr"         "https://github.com/desktop-app/lib_qr.git"
          clone_if_missing "Telegram/lib_translate"  "https://github.com/desktop-app/lib_translate.git"
          clone_if_missing "Telegram/lib_webrtc"     "https://github.com/desktop-app/lib_webrtc.git"
          clone_if_missing "Telegram/lib_webview"    "https://github.com/desktop-app/lib_webview.git"
          clone_if_missing "Telegram/lib_icu"        "https://github.com/AyuGram/lib_icu.git"
          clone_if_missing "Telegram/codegen"        "https://github.com/AyuGram/codegen.git"

          clone_if_missing "Telegram/ThirdParty/cmark-gfm" "https://github.com/desktop-app/cmark-gfm.git" ".git"
          clone_if_missing "Telegram/ThirdParty/libcbor"   "https://github.com/PJK/libcbor.git"            ".git"
          clone_if_missing "Telegram/ThirdParty/libfido2"  "https://github.com/Yubico/libfido2.git"         ".git"
          clone_if_missing "Telegram/ThirdParty/GSL"       "https://github.com/Microsoft/GSL.git"           ".git"
          clone_if_missing "Telegram/ThirdParty/xxHash"    "https://github.com/Cyan4973/xxHash.git"        ".git"
          clone_if_missing "Telegram/ThirdParty/lz4"       "https://github.com/lz4/lz4.git"                 ".git"
          clone_if_missing "Telegram/ThirdParty/patches"   "https://github.com/desktop-app/patches.git"     ".git"

          # Quick sanity check — don't fail here, just warn
          for f in cmake/version.cmake Telegram/lib_base/CMakeLists.txt; do
            [ -e "$f" ] && echo "OK: $f" || echo "WARN: $f missing"
          done

      - name: Patch prepare.py
        shell: python
        run: |
          import pathlib
          f = pathlib.Path("Telegram/build/prepare/prepare.py")
          content = f.read_text(encoding="utf-8")
          content = content.replace(
              "https://github.com/msys2/msys2-installer/releases/download/2025-08-30/msys2-base-x86_64-20250830.sfx.exe",
              "https://mirrors.aliyun.com/msys2/distrib/x86_64/msys2-base-x86_64-20250830.sfx.exe"
          )
          content = content.replace(
              "pacman -Syu --noconfirm ^\n        make ^",
              "pacman -S --noconfirm ^\n        make ^"
          )
          content = content.replace(
              "        mingw-w64-x86_64-diffutils ^\n",
              ""
          )
          f.write_text(content, encoding="utf-8")
          print("Patched prepare.py")

      - name: Prepare ThirdParty
        shell: cmd
        run: |
          call "%%VS_PATH%%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cd /d %%GITHUB_WORKSPACE%%\Telegram\build\prepare
          set Platform=x64
          set QT=6.11.2
          python -u prepare.py silent qt6 > D:\prep_out.log 2>&1
          echo PREPARE_EXIT_CODE=%%errorlevel%%
          type D:\prep_out.log
          exit /b %%errorlevel%%
        timeout-minutes: 150

      - name: Upload prep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-log
          path: D:\prep_out.log
          retention-days: 7

      - name: Configure + Build
        shell: cmd
        run: |
          call "%%VS_PATH%%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -G "Visual Studio 17 2022" -A x64 -B "D:\out" -S "%%GITHUB_WORKSPACE%%" -DCMAKE_BUILD_TYPE=Debug -DTDESKTOP_API_ID=1096745 -DTDESKTOP_API_HASH=52593a113a1b765d31122f7d1ed0656f -DT_DISABLE_DEBUG_SKIPPING=ON > D:\cmake_configure.log 2>&1
          echo CMAKE_EXIT_CODE=%%errorlevel%%
          type D:\cmake_configure.log
          cmake --build "D:\out" --config Debug --parallel 2 > D:\cmake_build.log 2>&1
          echo BUILD_EXIT_CODE=%%errorlevel%%
          type D:\cmake_build.log
          exit /b %%errorlevel%%
        timeout-minutes: 300

      - name: Upload CMake log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: D:\cmake_*.log
          retention-days: 7

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: D:\out\Debug\*
          retention-days: 14
