name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      Platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Print build environment
        shell: cmd
        run: |
          echo "=== os ==="
          ver
          echo "=== python ==="
          where python
          python --version
          echo "=== VS ==="
          where cl 2>nul || echo not found
          echo "=== cmake ==="
          cmake --version
          echo "=== env Platform ==="
          echo Platform=%Platform%
          echo "=== disk ==="
          wmic logicaldisk get caption,freespace,size
          echo "=== mem ==="
          wmic os get FreePhysicalMemory,TotalVisibleMemorySize

      - name: Test python can run prepare.py import
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare
          echo "=== cwd ==="
          cd
          echo "=== python test import ==="
          python -c "import sys; sys.path.insert(0, '.'); sys.path.insert(0, '..'); import qt_version; print('qt_version imported OK'); print('QT:', __import__('os').environ.get('QT', 'NOT SET'))" 2>&1
          echo "=== test env Platform ==="
          set Platform=x64
          python -c "import os; print('Platform in os.environ:', 'Platform' in os.environ); print('Value:', os.environ.get('Platform', 'NOT SET'))" 2>&1
          echo "=== try running prepare.py --help ==="
          python prepare.py --help 2>&1 || echo "FAILED with errorlevel %errorlevel%"

      - name: Run prepare.py (silent)
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare
          set Platform=x64
          set QT=6.11.2
          python prepare.py silent --qt6 --skip-tg_owt --skip-breakpad --skip-openal-soft --skip-ffmpeg --skip-nv-codec-headers --skip-libwebp --skip-libjxl
          echo EXIT_CODE=%errorlevel%
          exit /b %errorlevel%
        timeout-minutes: 120
