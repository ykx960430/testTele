name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Patch prepare.py msys64 stage
        shell: python
        run: |
          import pathlib
          f = pathlib.Path("Telegram/build/prepare/prepare.py")
          content = f.read_text(encoding="utf-8")

          # Fix 1: Download MSYS2 installer from Aliyun mirror to avoid 504.
          content = content.replace(
              "https://github.com/msys2/msys2-installer/releases/download/2025-08-30/msys2-base-x86_64-20250830.sfx.exe",
              "https://mirrors.aliyun.com/msys2/distrib/x86_64/msys2-base-x86_64-20250830.sfx.exe"
          )

          # Fix 2: pacman -Syu can fail after shell restart from core upgrade.
          content = content.replace(
              "pacman -Syu --noconfirm ^\n        make ^",
              "pacman -S --noconfirm ^\n        make ^"
          )

          # Fix 3: mingw-w64-x86_64-diffutils removed from MSYS2 mirrors.
          content = content.replace(
              "        mingw-w64-x86_64-diffutils ^\n",
              ""
          )

          f.write_text(content, encoding="utf-8")
          print("Patched prepare.py: Aliyun mirror, pacman -S, removed diffutils")

      - name: Prepare ThirdParty
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat" x64
          cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare
          set Platform=x64
          set QT=6.11.2
          echo === PREPARE START ===
          python -u prepare.py silent qt6 > D:\prep_out.log 2>&1
          set EXITCODE=%errorlevel%
          echo === PREPARE EXIT CODE: %EXITCODE% ===
          type D:\prep_out.log
          exit /b %EXITCODE%
        timeout-minutes: 150

      - name: Upload prep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-log
          path: D:\prep_out.log
          retention-days: 7

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -G "Visual Studio 17 2022" -A x64 -B out -S Telegram -DCMAKE_BUILD_TYPE=Debug -DTDESKTOP_API_ID=1096745 -DTDESKTOP_API_HASH=52593a113a1b765d31122f7d1ed0656f -DT_DISABLE_DEBUG_SKIPPING=ON

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build out --config Debug --parallel 2
        timeout-minutes: 300

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: out\Debug\*
          retention-days: 14
