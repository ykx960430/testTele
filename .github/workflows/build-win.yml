name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Test 1 - check python location
        shell: cmd
        run: where python

      - name: Test 2 - check workspace path
        shell: cmd
        run: echo %GITHUB_WORKSPACE%

      - name: Test 3 - cd to prepare dir and dir listing
        shell: cmd
        run: cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare && dir

      - name: Test 4 - simple python print
        shell: cmd
        run: cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare && python -c "print('hello')"

      - name: Test 5 - cd then python import os
        shell: cmd
        run: cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare && python -c "import os; print(os.getcwd())"

      - name: Test 6 - import qt_version
        shell: cmd
        run: cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare && python -c "import sys; sys.path.append('..'); import qt_version; print('OK')"

      - name: Test 7 - run prepare.py --help
        shell: cmd
        run: cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare && python prepare.py help 2>&1

      - name: Run prepare.py
        shell: cmd
        run: cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare && set Platform=x64 && set QT=6.11.2 && python prepare.py silent --qt6
        timeout-minutes: 120
