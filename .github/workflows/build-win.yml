name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

env:
  VS_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
  Platform: x64
  QT: '6.11.2'

jobs:
  preflight:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: none
          fetch-depth: 0

      - name: Clone CMake submodules
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          clone_repo() {
            local path="$1" url="$2" marker="${3:-CMakeLists.txt}"
            if [ ! -f "$path/$marker" ]; then
              rm -rf "$path"
              echo "Clone: $url -> $path"
              git clone --depth 1 "$url" "$path"
            fi
          }

          mkdir -p Telegram/ThirdParty
          clone_repo "cmake"              "https://github.com/desktop-app/cmake_helpers.git" "version.cmake"
          clone_repo "Telegram/lib_crl"   "https://github.com/desktop-app/lib_crl.git"
          clone_repo "Telegram/lib_rpl"   "https://github.com/desktop-app/lib_rpl.git"
          clone_repo "Telegram/lib_base"  "https://github.com/desktop-app/lib_base.git"
          clone_repo "Telegram/lib_ui"    "https://github.com/AyuGram/lib_ui.git"
          clone_repo "Telegram/lib_tl"    "https://github.com/AyuGram/lib_tl.git"
          clone_repo "Telegram/lib_spellcheck" "https://github.com/desktop-app/lib_spellcheck.git"
          clone_repo "Telegram/lib_storage"    "https://github.com/desktop-app/lib_storage.git"
          clone_repo "Telegram/lib_lottie"     "https://github.com/desktop-app/lib_lottie.git"
          clone_repo "Telegram/lib_qr"         "https://github.com/desktop-app/lib_qr.git"
          clone_repo "Telegram/lib_translate"  "https://github.com/desktop-app/lib_translate.git"
          clone_repo "Telegram/lib_webrtc"     "https://github.com/desktop-app/lib_webrtc.git"
          clone_repo "Telegram/lib_webview"    "https://github.com/desktop-app/lib_webview.git"
          clone_repo "Telegram/lib_icu"        "https://github.com/AyuGram/lib_icu.git"
          clone_repo "Telegram/codegen"        "https://github.com/AyuGram/codegen.git"
          clone_repo "Telegram/ThirdParty/cmark-gfm" "https://github.com/desktop-app/cmark-gfm.git" ".git"
          clone_repo "Telegram/ThirdParty/libcbor"   "https://github.com/PJK/libcbor.git"            ".git"
          clone_repo "Telegram/ThirdParty/libfido2"  "https://github.com/Yubico/libfido2.git"         ".git"
          clone_repo "Telegram/ThirdParty/GSL"       "https://github.com/Microsoft/GSL.git"           ".git"
          clone_repo "Telegram/ThirdParty/xxHash"    "https://github.com/Cyan4973/xxHash.git"        ".git"
          clone_repo "Telegram/ThirdParty/lz4"       "https://github.com/lz4/lz4.git"                 ".git"

          errors=0
          for f in \
            cmake/version.cmake cmake/validate_special_target.cmake \
            Telegram/lib_base/CMakeLists.txt Telegram/lib_ui/CMakeLists.txt \
            Telegram/lib_tl/CMakeLists.txt Telegram/codegen/CMakeLists.txt \
            Telegram/ThirdParty/cmark-gfm/.git Telegram/ThirdParty/libcbor/.git; do
            [ -e "$f" ] && echo "OK  $f" || { echo "FAIL $f"; errors=$((errors+1)); }
          done
          [ "$errors" -eq 0 ] && echo "Preflight PASSED" || { echo "Preflight FAILED"; exit 1; }

  build:
    needs: preflight
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: none
          fetch-depth: 0

      - name: Clone CMake submodules
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          clone_repo() {
            local path="$1" url="$2" marker="${3:-CMakeLists.txt}"
            if [ ! -f "$path/$marker" ]; then
              rm -rf "$path"
              echo "Clone: $url -> $path"
              git clone --depth 1 "$url" "$path"
            fi
          }

          mkdir -p Telegram/ThirdParty
          clone_repo "cmake"              "https://github.com/desktop-app/cmake_helpers.git" "version.cmake"
          clone_repo "Telegram/lib_crl"   "https://github.com/desktop-app/lib_crl.git"
          clone_repo "Telegram/lib_rpl"   "https://github.com/desktop-app/lib_rpl.git"
          clone_repo "Telegram/lib_base"  "https://github.com/desktop-app/lib_base.git"
          clone_repo "Telegram/lib_ui"    "https://github.com/AyuGram/lib_ui.git"
          clone_repo "Telegram/lib_tl"    "https://github.com/AyuGram/lib_tl.git"
          clone_repo "Telegram/lib_spellcheck" "https://github.com/desktop-app/lib_spellcheck.git"
          clone_repo "Telegram/lib_storage"    "https://github.com/desktop-app/lib_storage.git"
          clone_repo "Telegram/lib_lottie"     "https://github.com/desktop-app/lib_lottie.git"
          clone_repo "Telegram/lib_qr"         "https://github.com/desktop-app/lib_qr.git"
          clone_repo "Telegram/lib_translate"  "https://github.com/desktop-app/lib_translate.git"
          clone_repo "Telegram/lib_webrtc"     "https://github.com/desktop-app/lib_webrtc.git"
          clone_repo "Telegram/lib_webview"    "https://github.com/desktop-app/lib_webview.git"
          clone_repo "Telegram/lib_icu"        "https://github.com/AyuGram/lib_icu.git"
          clone_repo "Telegram/codegen"        "https://github.com/AyuGram/codegen.git"
          clone_repo "Telegram/ThirdParty/cmark-gfm" "https://github.com/desktop-app/cmark-gfm.git" ".git"
          clone_repo "Telegram/ThirdParty/libcbor"   "https://github.com/PJK/libcbor.git"            ".git"
          clone_repo "Telegram/ThirdParty/libfido2"  "https://github.com/Yubico/libfido2.git"         ".git"
          clone_repo "Telegram/ThirdParty/GSL"       "https://github.com/Microsoft/GSL.git"           ".git"
          clone_repo "Telegram/ThirdParty/xxHash"    "https://github.com/Cyan4973/xxHash.git"        ".git"
          clone_repo "Telegram/ThirdParty/lz4"       "https://github.com/lz4/lz4.git"                 ".git"

      - name: Patch prepare.py
        shell: cmd
        run: |
          powershell -Command "$c = Get-Content 'Telegram/build/prepare/prepare.py' -Raw; $c = $c -replace 'mingw-w64-x86_64-diffutils \^(\r?\n)?',''; $c = $c -replace 'https://github.com/msys2/msys2-installer/releases/download/2025-08-30/msys2-base-x86_64-20250830\.sfx\.exe','https://mirrors.aliyun.com/msys2/distrib/x86_64/msys2-base-x86_64-20250830.sfx.exe'; Set-Content 'Telegram/build/prepare/prepare.py' $c -NoNewline; Write-Output 'OK: diffutils removed, MSYS2 installer -> aliyun mirror'"

      - name: Prepare ThirdParty
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare
          set Platform=x64
          set QT=6.11.2
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          python prepare.py silent qt6 2>&1
        timeout-minutes: 360

      - name: Verify Qt installed
        shell: cmd
        run: |
          DIR "%GITHUB_WORKSPACE%\..\Libraries\win64\" 2>NUL
          IF EXIST "%GITHUB_WORKSPACE%\..\Libraries\win64\Qt-6.11.2\lib\cmake\Qt6\Qt6Config.cmake" (
            ECHO Qt6Config.cmake FOUND
            DIR "%GITHUB_WORKSPACE%\..\Libraries\win64\Qt-6.11.2\lib\cmake\Qt6\" 2>NUL
          ) ELSE (
            ECHO Qt6Config.cmake NOT found at parent/Libraries/win64.
            ECHO Checking prepare cache_keys:
            DIR "%GITHUB_WORKSPACE%\Telegram\build\prepare\cache_keys\" 2>NUL
            TYPE "%GITHUB_WORKSPACE%\Telegram\build\prepare\cache_keys\qt_6.11.2" 2>NUL || echo NO qt_6.11.2 cache entry
            ECHO Also checking if prepare libs dir exists:
            DIR "%GITHUB_WORKSPACE%\Telegram\build\prepare\Libraries\win64\" 2>NUL || echo prepare libs dir does NOT exist
            EXIT /B 1
          )

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake -G "Ninja Multi-Config" -B "D:\out" -S "%GITHUB_WORKSPACE%" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          IF %ERRORLEVEL% NEQ 0 EXIT /B %ERRORLEVEL%
        timeout-minutes: 30

      - name: Verify build system generated
        shell: cmd
        run: |
          DIR D:\out\
          IF NOT EXIST D:\out\build.ninja (
            ECHO build.ninja NOT generated
            EXIT /B 1
          )
          ECHO build.ninja EXISTS

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake --build "D:\out" --config Debug --parallel 2
          IF %ERRORLEVEL% NEQ 0 EXIT /B %ERRORLEVEL%
        timeout-minutes: 300

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: D:\out\Debug\Telegram.exe
          retention-days: 14
