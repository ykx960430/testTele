name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

env:
  VS_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
  Platform: x64
  QT: '6.11.2'

jobs:
  preflight:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: none
          fetch-depth: 0

      - name: Clone submodules
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config --global --unset-all url.https://ghproxy.net/https://github.com/.insteadOf 2>/dev/null || true

          clone_repo() {
            local path="$1" url="$2" marker="${3:-CMakeLists.txt}"
            if [ ! -f "$path/$marker" ]; then
              rm -rf "$path"
              echo "Clone: $url -> $path"
              git clone --depth 1 "$url" "$path"
            fi
          }

          mkdir -p Telegram/ThirdParty
          clone_repo "cmake" "https://github.com/desktop-app/cmake_helpers.git" "version.cmake"
          clone_repo "Telegram/lib_crl"        "https://github.com/desktop-app/lib_crl.git"
          clone_repo "Telegram/lib_rpl"        "https://github.com/desktop-app/lib_rpl.git"
          clone_repo "Telegram/lib_base"       "https://github.com/desktop-app/lib_base.git"
          clone_repo "Telegram/lib_ui"         "https://github.com/AyuGram/lib_ui.git"
          clone_repo "Telegram/lib_tl"         "https://github.com/AyuGram/lib_tl.git"
          clone_repo "Telegram/lib_spellcheck" "https://github.com/desktop-app/lib_spellcheck.git"
          clone_repo "Telegram/lib_storage"    "https://github.com/desktop-app/lib_storage.git"
          clone_repo "Telegram/lib_lottie"     "https://github.com/desktop-app/lib_lottie.git"
          clone_repo "Telegram/lib_qr"         "https://github.com/desktop-app/lib_qr.git"
          clone_repo "Telegram/lib_translate"  "https://github.com/desktop-app/lib_translate.git"
          clone_repo "Telegram/lib_webrtc"     "https://github.com/desktop-app/lib_webrtc.git"
          clone_repo "Telegram/lib_webview"    "https://github.com/desktop-app/lib_webview.git"
          clone_repo "Telegram/lib_icu"        "https://github.com/AyuGram/lib_icu.git"
          clone_repo "Telegram/codegen"        "https://github.com/AyuGram/codegen.git"
          clone_repo "Telegram/ThirdParty/cmark-gfm" "https://github.com/desktop-app/cmark-gfm.git" ".git"
          clone_repo "Telegram/ThirdParty/libcbor"   "https://github.com/PJK/libcbor.git"            ".git"
          clone_repo "Telegram/ThirdParty/libfido2"  "https://github.com/Yubico/libfido2.git"         ".git"
          clone_repo "Telegram/ThirdParty/GSL"       "https://github.com/Microsoft/GSL.git"           ".git"
          clone_repo "Telegram/ThirdParty/xxHash"    "https://github.com/Cyan4973/xxHash.git"        ".git"
          clone_repo "Telegram/ThirdParty/lz4"       "https://github.com/lz4/lz4.git"                 ".git"
          clone_repo "Telegram/ThirdParty/patches"   "https://github.com/desktop-app/patches.git"     ".git"

          errors=0
          for f in \
            cmake/version.cmake cmake/validate_special_target.cmake \
            Telegram/lib_base/CMakeLists.txt Telegram/lib_ui/CMakeLists.txt \
            Telegram/lib_tl/CMakeLists.txt Telegram/codegen/CMakeLists.txt \
            Telegram/ThirdParty/cmark-gfm/.git Telegram/ThirdParty/libcbor/.git; do
            [ -e "$f" ] && echo "OK  $f" || { echo "FAIL $f"; errors=$((errors+1)); }
          done
          [ "$errors" -eq 0 ] && echo "Preflight PASSED" || { echo "Preflight FAILED"; exit 1; }

  build:
    needs: preflight
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: none
          fetch-depth: 0

      - name: Clone submodules
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --unset-all url.https://ghproxy.net/https://github.com/.insteadOf 2>/dev/null || true

          clone_repo() {
            local path="$1" url="$2" marker="${3:-CMakeLists.txt}"
            if [ ! -f "$path/$marker" ]; then
              rm -rf "$path"
              echo "Clone: $url -> $path"
              git clone --depth 1 "$url" "$path"
            fi
          }

          mkdir -p Telegram/ThirdParty
          clone_repo "cmake" "https://github.com/desktop-app/cmake_helpers.git" "version.cmake"
          clone_repo "Telegram/lib_crl"        "https://github.com/desktop-app/lib_crl.git"
          clone_repo "Telegram/lib_rpl"        "https://github.com/desktop-app/lib_rpl.git"
          clone_repo "Telegram/lib_base"       "https://github.com/desktop-app/lib_base.git"
          clone_repo "Telegram/lib_ui"         "https://github.com/AyuGram/lib_ui.git"
          clone_repo "Telegram/lib_tl"         "https://github.com/AyuGram/lib_tl.git"
          clone_repo "Telegram/lib_spellcheck" "https://github.com/desktop-app/lib_spellcheck.git"
          clone_repo "Telegram/lib_storage"    "https://github.com/desktop-app/lib_storage.git"
          clone_repo "Telegram/lib_lottie"     "https://github.com/desktop-app/lib_lottie.git"
          clone_repo "Telegram/lib_qr"         "https://github.com/desktop-app/lib_qr.git"
          clone_repo "Telegram/lib_translate"  "https://github.com/desktop-app/lib_translate.git"
          clone_repo "Telegram/lib_webrtc"     "https://github.com/desktop-app/lib_webrtc.git"
          clone_repo "Telegram/lib_webview"    "https://github.com/desktop-app/lib_webview.git"
          clone_repo "Telegram/lib_icu"        "https://github.com/AyuGram/lib_icu.git"
          clone_repo "Telegram/codegen"        "https://github.com/AyuGram/codegen.git"
          clone_repo "Telegram/ThirdParty/cmark-gfm" "https://github.com/desktop-app/cmark-gfm.git" ".git"
          clone_repo "Telegram/ThirdParty/libcbor"   "https://github.com/PJK/libcbor.git"            ".git"
          clone_repo "Telegram/ThirdParty/libfido2"  "https://github.com/Yubico/libfido2.git"         ".git"
          clone_repo "Telegram/ThirdParty/GSL"       "https://github.com/Microsoft/GSL.git"           ".git"
          clone_repo "Telegram/ThirdParty/xxHash"    "https://github.com/Cyan4973/xxHash.git"        ".git"
          clone_repo "Telegram/ThirdParty/lz4"       "https://github.com/lz4/lz4.git"                 ".git"
          clone_repo "Telegram/ThirdParty/patches"   "https://github.com/desktop-app/patches.git"     ".git"

          for f in cmake/version.cmake Telegram/lib_base/CMakeLists.txt; do
            [ -e "$f" ] && echo "OK  $f" || echo "WARN $f missing"
          done

      - name: Patch prepare.py
        shell: cmd
        run: |
          powershell -Command "$c = Get-Content 'Telegram/build/prepare/prepare.py' -Raw; $c = $c.Replace('https://github.com/msys2/msys2-installer/releases/download/2025-08-30/msys2-base-x86_64-20250830.sfx.exe','https://mirrors.aliyun.com/msys2/distrib/x86_64/msys2-base-x86_64-20250830.sfx.exe'); $c = $c.Replace(\"pacman -Syu --noconfirm ^\n        make ^\",\"pacman -S --noconfirm ^\n        make ^\"); $c = $c -replace 'mingw-w64-x86_64-diffutils \^\n',''; Set-Content 'Telegram/build/prepare/prepare.py' $c -NoNewline; Write-Output 'OK'"

      - name: Clean any cached build state
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          # Remove ALL prepare output and cache directories
          rm -rf Telegram/ThirdParty 2>/dev/null || true
          rm -rf Telegram/build/prepare/ThirdParty 2>/dev/null || true
          rm -rf Telegram/build/prepare/Libraries 2>/dev/null || true
          rm -rf Telegram/build/prepare/cache_keys 2>/dev/null || true
          # Verify they're gone
          echo "=== After cleanup ==="
          ls -la Telegram/build/prepare/ 2>/dev/null || echo "prepare dir doesn't exist"
          find Telegram/build/prepare -name "cache_keys" -maxdepth 3 2>/dev/null || echo "No cache_keys dirs found"
          echo "Cleaned"

      - name: Prepare ThirdParty
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare
          set Platform=x64
          set QT=6.11.2
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          python prepare.py silent qt6 qt_6.11.2 2>&1
          echo PREP_EXIT=%errorlevel%
          exit /b 0
        timeout-minutes: 150

      - name: Move libs to CMake-expected path
        shell: cmd
        run: |
          mkdir "%GITHUB_WORKSPACE%\..\Libraries\win64" 2>NUL
          xcopy /E /I /Y "%GITHUB_WORKSPACE%\Telegram\build\prepare\Libraries\win64\*" "%GITHUB_WORKSPACE%\..\Libraries\win64\" 2>NUL
          DIR "%GITHUB_WORKSPACE%\..\Libraries\win64\" 2>NUL
        continue-on-error: true

      - name: Verify Qt installed
        shell: cmd
        run: |
          IF EXIST "%GITHUB_WORKSPACE%\..\Libraries\win64\Qt-6.11.2\lib\cmake\Qt6\Qt6Config.cmake" (
            ECHO Qt6Config.cmake FOUND at parent/Libraries
          ) ELSE IF EXIST "%GITHUB_WORKSPACE%\Telegram\build\prepare\Libraries\win64\Qt-6.11.2\lib\cmake\Qt6\Qt6Config.cmake" (
            ECHO Qt6Config.cmake FOUND at Telegram/build/prepare/Libraries
          ) ELSE (
            ECHO Qt6Config.cmake NOT found in expected locations.
            ECHO Searching for Qt6Config.cmake anywhere...
            DIR /S /B D:\Qt6Config.cmake 2>NUL
            DIR /S /B %GITHUB_WORKSPACE%\Qt6Config.cmake 2>NUL
            ECHO === Check prepare libs content ===
            DIR "%GITHUB_WORKSPACE%\Telegram\build\prepare\Libraries\win64\" 2>NUL
            EXIT /B 1
          )

      - name: Rebuild Qt stage if missing
        shell: cmd
        if: failure()
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare
          set Platform=x64
          set QT=6.11.2
          python -u prepare.py silent qt_6.11.2 2>&1 || exit /b %errorlevel%
          mkdir "%GITHUB_WORKSPACE%\..\Libraries\win64" 2>NUL
          xcopy /E /I /Y "%GITHUB_WORKSPACE%\Telegram\build\prepare\Libraries\win64\Qt-6.11.2\*" "%GITHUB_WORKSPACE%\..\Libraries\win64\Qt-6.11.2\" 2>NUL
          DIR "%GITHUB_WORKSPACE%\..\Libraries\win64\Qt-6.11.2\" 2>NUL || ECHO Qt-6.11.2 folder not found
        timeout-minutes: 180

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake -G "Ninja Multi-Config" -B "D:\out" -S "%GITHUB_WORKSPACE%" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          IF %ERRORLEVEL% NEQ 0 EXIT /B %ERRORLEVEL%
        timeout-minutes: 30

      - name: Verify build system generated
        shell: cmd
        run: |
          DIR D:\out\
          IF NOT EXIST D:\out\build.ninja (
            ECHO build.ninja NOT generated
            EXIT /B 1
          )
          ECHO build.ninja EXISTS

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake --build "D:\out" --config Debug --parallel 2
          IF %ERRORLEVEL% NEQ 0 EXIT /B %ERRORLEVEL%
        timeout-minutes: 300

      - name: Inspect build dir after build
        shell: cmd
        run: |
          DIR D:\out\
          DIR D:\out\Debug\ 2>NUL || ECHO No Debug folder
        continue-on-error: true

      - name: Verify build output
        shell: cmd
        run: |
          IF EXIST "D:\out\Debug\Telegram.exe" (
            ECHO FOUND Telegram.exe
            DIR "D:\out\Debug\Telegram.exe"
          ) ELSE (
            ECHO NOT FOUND Telegram.exe
            DIR D:\out\ 2>NUL
            DIR D:\out\Debug\ 2>NUL || ECHO Debug folder missing
            EXIT /B 1
          )

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: D:\out\Debug\Telegram.exe
          retention-days: 14
