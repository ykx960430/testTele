name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      Platform: x64

    steps:
      - name: Show Python info
        shell: cmd
        run: where python && python --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show runner info
        shell: powershell
        run: |
          echo "OS: $([System.Environment]::OSVersion)"
          echo "CPU: $env:NUMBER_OF_PROCESSORS cores"
          $os = Get-CimInstance Win32_OperatingSystem
          $free = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
          $total = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
          echo "RAM: $free GB free / $total GB total"
          Get-PSDrive C, D | Format-Table Name,
            @{N='Free(GB)';E={[math]::Round($_.Free/1GB,1)}},
            @{N='Used(GB)';E={[math]::Round($_.Used/1GB,1)}}

      - name: Checkout submodules (force)
        shell: powershell
        run: |
          git submodule update --init --recursive --force 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "Some submodules may have failed, continuing..." }

      - name: Prepare ThirdParty
        working-directory: ${{ github.workspace }}\Telegram\build\prepare
        shell: powershell
        run: |
          $env:Platform = "x64"
          $env:QT = "6.11.2"
          python prepare.py --qt6 --skip-qt5 --skip-tg_owt --skip-breakpad --skip-openal-soft --skip-ffmpeg --skip-nv-codec-headers --skip-libwebp --skip-libjxl
          if ($LASTEXITCODE -ne 0) { Write-Host "prepare.py failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
        timeout-minutes: 120

      - name: Configure CMake
        shell: powershell
        run: |
          $env:Platform = "x64"
          cmake -G "Visual Studio 17 2022" -A x64 -B out -S Telegram `
            -DCMAKE_BUILD_TYPE=Debug `
            -DTDESKTOP_API_ID=1096745 `
            -DTDESKTOP_API_HASH=52593a113a1b765d31122f7d1ed0656f `
            -DT_DISABLE_DEBUG_SKIPPING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Telegram
        shell: powershell
        run: |
          $env:Platform = "x64"
          cmake --build out --config Debug --target Telegram --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 300

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: ${{ github.workspace }}\out\Debug\*
          retention-days: 14
