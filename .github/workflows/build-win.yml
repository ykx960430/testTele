name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      Platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare ThirdParty
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare
          set Platform=x64
          set QT=6.11.2
          echo === PREPARE START ===
          python -u prepare.py silent qt6 > D:\prep_out.log 2>&1
          set EXITCODE=%errorlevel%
          echo === PREPARE EXIT CODE: %EXITCODE% ===
          type D:\prep_out.log
          exit /b %EXITCODE%
        timeout-minutes: 150

      - name: Upload prep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-log
          path: D:\prep_out.log
          retention-days: 7

      - name: Configure CMake
        shell: cmd
        run: cmake -G "Visual Studio 17 2022" -A x64 -B out -S Telegram -DCMAKE_BUILD_TYPE=Debug -DTDESKTOP_API_ID=1096745 -DTDESKTOP_API_HASH=52593a113a1b765d31122f7d1ed0656f -DT_DISABLE_DEBUG_SKIPPING=ON

      - name: Build
        shell: cmd
        run: cmake --build out --config Debug --parallel 2
        timeout-minutes: 300

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: out\Debug\*
          retention-days: 14
