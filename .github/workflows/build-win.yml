name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

env:
  VS_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
  QT: '6.11.2'
  Platform: x64

jobs:
  # 快速预检查：秒级发现问题，不要等 2 小时的 prepare 做完才发现子模块缺失
  preflight:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify critical submodules
        shell: bash
        run: |
          # 清理 ghproxy 干扰（GitHub Actions runner 可能有全局 gitconfig）
          if git config --global --get url.https://ghproxy.net/https://github.com/.insteadOf 2>/dev/null; then
            echo "Removing ghproxy redirect..."
            git config --global --unset url.https://ghproxy.net/https://github.com/.insteadOf
          fi

          # 强制初始化所有子模块
          git submodule sync --recursive
          git submodule update --init --recursive --force 2>&1 | tail -5

          # 验证关键子模块（CMakeLists.txt 依赖它们）
          for sub in cmake; do
            if [ ! -f "$sub/version.cmake" ]; then
              echo "ERROR: $sub submodule is empty! Trying manual clone..."
              rm -rf "$sub"
              git clone --depth 1 "https://github.com/desktop-app/cmake_helpers.git" "$sub"
            fi
          done

          # 快速验证：cmake include 文件是否存在
          echo "=== Checking cmake includes ==="
          for f in cmake/version.cmake cmake/validate_special_target.cmake cmake/init_target.cmake; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "FAIL: $f not found!"
              exit 1
            fi
          done
          echo "Preflight passed"

  build:
    needs: preflight
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force populate ALL submodules
        shell: bash
        run: |
          # 清理 ghproxy 干扰
          git config --global --unset-all url.https://ghproxy.net/https://github.com/.insteadOf 2>/dev/null || true

          # 强制重新初始化所有子模块（actions/checkout 在这个大仓库上不稳定）
          git submodule sync --recursive 2>&1 | tail -3
          git submodule update --init --recursive --force 2>&1 | tail -10

          # 验证 Telegram 关键子模块（CMakeLists.txt 依赖它们）
          for sub in Telegram/lib_base Telegram/lib_ui Telegram/lib_tl Telegram/codegen \
                     Telegram/lib_crl Telegram/lib_rpl Telegram/lib_spellcheck \
                     Telegram/lib_storage Telegram/lib_lottie Telegram/lib_qr \
                     Telegram/lib_translate Telegram/lib_webrtc Telegram/lib_webview \
                     Telegram/lib_icu \
                     Telegram/ThirdParty/cmark-gfm Telegram/ThirdParty/libcbor \
                     Telegram/ThirdParty/libfido2 Telegram/ThirdParty/patches \
                     cmake; do
            if [ ! -f "$sub/CMakeLists.txt" ] && [ ! -f "$sub/version.cmake" ] && [ ! -f "$sub/.git" ] && [ ! -f "$sub/README.md" ]; then
              echo "WARNING: $sub may be empty"
            else
              echo "OK: $sub"
            fi
          done

      - name: Patch prepare.py
        shell: python
        run: |
          import pathlib
          f = pathlib.Path("Telegram/build/prepare/prepare.py")
          content = f.read_text(encoding="utf-8")
          # Aliyun mirror for MSYS2 installer (GitHub releases gives 504)
          content = content.replace(
              "https://github.com/msys2/msys2-installer/releases/download/2025-08-30/msys2-base-x86_64-20250830.sfx.exe",
              "https://mirrors.aliyun.com/msys2/distrib/x86_64/msys2-base-x86_64-20250830.sfx.exe"
          )
          # pacman -Syu can fail after shell restart from core-upgrade
          content = content.replace(
              "pacman -Syu --noconfirm ^\n        make ^",
              "pacman -S --noconfirm ^\n        make ^"
          )
          # mingw-w64-x86_64-diffutils removed from current MSYS2 mirrors
          content = content.replace(
              "        mingw-w64-x86_64-diffutils ^\n",
              ""
          )
          f.write_text(content, encoding="utf-8")
          print("Patched prepare.py")

      - name: Prepare ThirdParty
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare
          set Platform=x64
          set QT=6.11.2
          python -u prepare.py silent qt6 > D:\prep_out.log 2>&1
          echo PREPARE_EXIT_CODE=%errorlevel%
          exit /b %errorlevel%
        timeout-minutes: 150

      - name: Upload prep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-log
          path: D:\prep_out.log
          retention-days: 7

      - name: Configure + Build
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -G "Visual Studio 17 2022" -A x64 -B "D:\out" -S "%GITHUB_WORKSPACE%" -DCMAKE_BUILD_TYPE=Debug -DTDESKTOP_API_ID=1096745 -DTDESKTOP_API_HASH=52593a113a1b765d31122f7d1ed0656f -DT_DISABLE_DEBUG_SKIPPING=ON > D:\cmake_configure.log 2>&1
          echo CMAKE_EXIT_CODE=%errorlevel%
          type D:\cmake_configure.log
          cmake --build "D:\out" --config Debug --parallel 2 > D:\cmake_build.log 2>&1
          echo BUILD_EXIT_CODE=%errorlevel%
          exit /b %errorlevel%
        timeout-minutes: 300

      - name: Upload CMake log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: D:\cmake_*.log
          retention-days: 7

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: D:\out\Debug\*
          retention-days: 14
