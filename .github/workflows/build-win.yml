name: Windows Build

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

env:
  VS_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
  Platform: x64
  QT: '5.15.19'

jobs:
  preflight:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: none
          fetch-depth: 0

      - name: Clone CMake submodules
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          clone_repo() {
            local path="$1" url="$2" sha="$3"
            if [ ! -d "$path/.git" ]; then
              rm -rf "$path"
              echo "Clone $url @ ${sha:0:8} -> $path"
              git init -q "$path"
              git -C "$path" remote add origin "$url"
              git -C "$path" fetch -q --depth 1 origin "$sha"
              git -C "$path" checkout -q FETCH_HEAD
            fi
          }

          # Pins match the AyuGram dev state this snapshot is based on
          # (cmake_helpers 5e21e7ac = tlottie, no protobuf, no wallet_engine).
          mkdir -p Telegram/ThirdParty
          clone_repo "cmake"              "https://github.com/desktop-app/cmake_helpers.git" "5e21e7ac353138128145ec4419c0666dc9959347"
          clone_repo "Telegram/lib_crl"   "https://github.com/desktop-app/lib_crl.git"          "7a165302fed408c84b2d1c2513e35a21a141da44"
          clone_repo "Telegram/lib_rpl"   "https://github.com/desktop-app/lib_rpl.git"          "c57cccffb01d85570decd7fccb88419c9a682e63"
          clone_repo "Telegram/lib_base"  "https://github.com/desktop-app/lib_base.git"         "de35c7abcbf6464a0845695a55568bdac12a5fba"
          clone_repo "Telegram/codegen"   "https://github.com/AyuGram/codegen.git"              "be951ec045da4f3a6dc271a758ce50c2c45a6d8a"
          clone_repo "Telegram/lib_ui"    "https://github.com/AyuGram/lib_ui.git"               "e3d058223aea0b68938a07a7d436d67aaf2b1b30"
          clone_repo "Telegram/lib_lottie" "https://github.com/desktop-app/lib_lottie.git"      "7d00b5048aff8dd93c0a9721abf50006d20682be"
          clone_repo "Telegram/lib_tl"    "https://github.com/AyuGram/lib_tl.git"               "eb38efe1447ae02883f9619ec899b4fe21309b95"
          clone_repo "Telegram/lib_spellcheck" "https://github.com/desktop-app/lib_spellcheck" "3273fd25c185fb626a9836dafbd644c2bd129ee1"
          clone_repo "Telegram/lib_storage"    "https://github.com/desktop-app/lib_storage.git" "ccdc72548a5065b5991b4e06e610d76bc4f6023e"
          clone_repo "Telegram/lib_qr"         "https://github.com/desktop-app/lib_qr.git"      "6fdf60461444ba150e13ac36009c0ffce72c4c83"
          clone_repo "Telegram/lib_translate"  "https://github.com/desktop-app/lib_translate"   "09c10726220e6862ca91d39b5dec5119aa0177bc"
          clone_repo "Telegram/lib_webrtc"     "https://github.com/desktop-app/lib_webrtc.git"  "52636e86eaa493de670daf71959d000b281bd153"
          clone_repo "Telegram/lib_webview"    "https://github.com/desktop-app/lib_webview.git" "596fb2432b7c479e9499f8ede64fe6775e65ae91"
          clone_repo "Telegram/lib_icu"        "https://github.com/AyuGram/lib_icu.git"         "7e55ddbcda78145b1fdb55c1f07f39299fa263f6"
          clone_repo "Telegram/ThirdParty/GSL"        "https://github.com/Microsoft/GSL.git"            "87f9d768866548b5b86e72be66c60c5abd4d9b37"
          clone_repo "Telegram/ThirdParty/xxHash"     "https://github.com/Cyan4973/xxHash.git"          "bbb27a5efb85b92a0486cf361a8635715a53f6ba"
          clone_repo "Telegram/ThirdParty/lz4"        "https://github.com/lz4/lz4.git"                  "5ff839680134437dbf4678f3d0c7b371d84f4964"
          clone_repo "Telegram/ThirdParty/cmark-gfm"  "https://github.com/desktop-app/cmark-gfm.git"         "d7d4a24a9ebfa7581994ea6df0297662bfeaf413"
          clone_repo "Telegram/ThirdParty/libcbor"    "https://github.com/PJK/libcbor.git"              "170bee2b82cdb7b2ed25af301f62cb6efdd40ec1"
          clone_repo "Telegram/ThirdParty/libfido2"   "https://github.com/Yubico/libfido2.git"          "b974e7cf2ee7392134cc12c08b76a068cf250dd8"
          clone_repo "Telegram/ThirdParty/expected"   "https://github.com/TartanLlama/expected"         "292eff8bd8ee230a7df1d6a1c00c4ea0eb2f0362"
          clone_repo "Telegram/ThirdParty/QR"         "https://github.com/nayuki/QR-Code-generator"     "720f62bddb7226106071d4728c292cb1df519ceb"
          clone_repo "Telegram/ThirdParty/hunspell"   "https://github.com/hunspell/hunspell"            "a698d8b53cab3507d1d619d5fa08a88777abe50b"
          clone_repo "Telegram/ThirdParty/range-v3"   "https://github.com/ericniebler/range-v3.git"     "a81477931a8aa2ad025c6bda0609f38e09e4d7ec"
          clone_repo "Telegram/ThirdParty/tgcalls"    "https://github.com/TelegramMessenger/tgcalls.git" "2faee3b5524f54d56c91c2058c00e11c656a74b3"
          clone_repo "Telegram/ThirdParty/kimageformats" "https://github.com/KDE/kimageformats.git"     "df82311a1081e576c4ac020204578bb8a81b21ec"
          clone_repo "Telegram/ThirdParty/kcoreaddons"   "https://github.com/KDE/kcoreaddons.git"       "fd84da51b554eac25e35b1e3f373edaab3029b15"
          clone_repo "Telegram/ThirdParty/cld3"          "https://github.com/google/cld3.git"           "b48dc46512566f5a2d41118c8c1116c4f96dc661"
          clone_repo "Telegram/ThirdParty/libprisma"     "https://github.com/desktop-app/libprisma.git" "23b0d70f9709da9b38561d5706891a134d18df76"
          clone_repo "Telegram/ThirdParty/MicroTeX"      "https://github.com/desktop-app/MicroTeX.git"  "61aaa7cc354de91d5898ffb0b2a6c62628d9a76f"
          clone_repo "Telegram/ThirdParty/TooManyCooks"  "https://github.com/tzcnt/TooManyCooks.git"    "b86af81982860c96295a7e95e4c60cb335615cef"

          errors=0
          for f in \
            cmake/version.cmake cmake/validate_special_target.cmake \
            Telegram/lib_base/CMakeLists.txt Telegram/lib_ui/CMakeLists.txt \
            Telegram/lib_tl/CMakeLists.txt Telegram/codegen/CMakeLists.txt \
            Telegram/ThirdParty/cmark-gfm/.git Telegram/ThirdParty/libcbor/.git; do
            [ -e "$f" ] && echo "OK  $f" || { echo "FAIL $f"; errors=$((errors+1)); }
          done
          [ "$errors" -eq 0 ] && echo "Preflight PASSED" || { echo "Preflight FAILED"; exit 1; }

  build:
    needs: preflight
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: none
          fetch-depth: 0

      - name: Restore Libraries cache
        id: cache_libs
        uses: actions/cache/restore@v4
        with:
          path: D:\a\testTele\Libraries
          key: prepare-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-${{ hashFiles('Telegram/build/qt_version.py') }}

      - name: Recreate cached stage directories
        shell: bash
        run: |
          set +e
          LIBS="D:/a/testTele/Libraries"
          KEYS="$LIBS/win64/cache_keys"
          # prepare.py treats a missing stage directory as "rebuild this stage".
          # The Qt source checkout is emptied before caching (it is never read
          # by the build), so put the empty directory back or the 25 minute
          # jom build of Qt runs again on every single run.
          if [ -f "$KEYS/qt_5.15.19" ]; then
            mkdir -p "$LIBS/win64/qt_5.15.19"
            echo "recreated empty qt_5.15.19 so the Qt stage is skipped"
          else
            echo "no qt_5.15.19 cache_key, Qt will be built"
          fi

      - name: Clone CMake submodules
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          clone_repo() {
            local path="$1" url="$2" sha="$3"
            if [ ! -d "$path/.git" ]; then
              rm -rf "$path"
              echo "Clone $url @ ${sha:0:8} -> $path"
              git init -q "$path"
              git -C "$path" remote add origin "$url"
              git -C "$path" fetch -q --depth 1 origin "$sha"
              git -C "$path" checkout -q FETCH_HEAD
            fi
          }

          # Pins match the AyuGram dev state this snapshot is based on
          # (cmake_helpers 5e21e7ac = tlottie, no protobuf, no wallet_engine).
          mkdir -p Telegram/ThirdParty
          clone_repo "cmake"              "https://github.com/desktop-app/cmake_helpers.git" "5e21e7ac353138128145ec4419c0666dc9959347"
          clone_repo "Telegram/lib_crl"   "https://github.com/desktop-app/lib_crl.git"          "7a165302fed408c84b2d1c2513e35a21a141da44"
          clone_repo "Telegram/lib_rpl"   "https://github.com/desktop-app/lib_rpl.git"          "c57cccffb01d85570decd7fccb88419c9a682e63"
          clone_repo "Telegram/lib_base"  "https://github.com/desktop-app/lib_base.git"         "de35c7abcbf6464a0845695a55568bdac12a5fba"
          clone_repo "Telegram/codegen"   "https://github.com/AyuGram/codegen.git"              "be951ec045da4f3a6dc271a758ce50c2c45a6d8a"
          clone_repo "Telegram/lib_ui"    "https://github.com/AyuGram/lib_ui.git"               "e3d058223aea0b68938a07a7d436d67aaf2b1b30"
          clone_repo "Telegram/lib_lottie" "https://github.com/desktop-app/lib_lottie.git"      "7d00b5048aff8dd93c0a9721abf50006d20682be"
          clone_repo "Telegram/lib_tl"    "https://github.com/AyuGram/lib_tl.git"               "eb38efe1447ae02883f9619ec899b4fe21309b95"
          clone_repo "Telegram/lib_spellcheck" "https://github.com/desktop-app/lib_spellcheck" "3273fd25c185fb626a9836dafbd644c2bd129ee1"
          clone_repo "Telegram/lib_storage"    "https://github.com/desktop-app/lib_storage.git" "ccdc72548a5065b5991b4e06e610d76bc4f6023e"
          clone_repo "Telegram/lib_qr"         "https://github.com/desktop-app/lib_qr.git"      "6fdf60461444ba150e13ac36009c0ffce72c4c83"
          clone_repo "Telegram/lib_translate"  "https://github.com/desktop-app/lib_translate"   "09c10726220e6862ca91d39b5dec5119aa0177bc"
          clone_repo "Telegram/lib_webrtc"     "https://github.com/desktop-app/lib_webrtc.git"  "52636e86eaa493de670daf71959d000b281bd153"
          clone_repo "Telegram/lib_webview"    "https://github.com/desktop-app/lib_webview.git" "596fb2432b7c479e9499f8ede64fe6775e65ae91"
          clone_repo "Telegram/lib_icu"        "https://github.com/AyuGram/lib_icu.git"         "7e55ddbcda78145b1fdb55c1f07f39299fa263f6"
          clone_repo "Telegram/ThirdParty/GSL"        "https://github.com/Microsoft/GSL.git"            "87f9d768866548b5b86e72be66c60c5abd4d9b37"
          clone_repo "Telegram/ThirdParty/xxHash"     "https://github.com/Cyan4973/xxHash.git"          "bbb27a5efb85b92a0486cf361a8635715a53f6ba"
          clone_repo "Telegram/ThirdParty/lz4"        "https://github.com/lz4/lz4.git"                  "5ff839680134437dbf4678f3d0c7b371d84f4964"
          clone_repo "Telegram/ThirdParty/cmark-gfm"  "https://github.com/desktop-app/cmark-gfm.git"         "d7d4a24a9ebfa7581994ea6df0297662bfeaf413"
          clone_repo "Telegram/ThirdParty/libcbor"    "https://github.com/PJK/libcbor.git"              "170bee2b82cdb7b2ed25af301f62cb6efdd40ec1"
          clone_repo "Telegram/ThirdParty/libfido2"   "https://github.com/Yubico/libfido2.git"          "b974e7cf2ee7392134cc12c08b76a068cf250dd8"
          clone_repo "Telegram/ThirdParty/expected"   "https://github.com/TartanLlama/expected"         "292eff8bd8ee230a7df1d6a1c00c4ea0eb2f0362"
          clone_repo "Telegram/ThirdParty/QR"         "https://github.com/nayuki/QR-Code-generator"     "720f62bddb7226106071d4728c292cb1df519ceb"
          clone_repo "Telegram/ThirdParty/hunspell"   "https://github.com/hunspell/hunspell"            "a698d8b53cab3507d1d619d5fa08a88777abe50b"
          clone_repo "Telegram/ThirdParty/range-v3"   "https://github.com/ericniebler/range-v3.git"     "a81477931a8aa2ad025c6bda0609f38e09e4d7ec"
          clone_repo "Telegram/ThirdParty/tgcalls"    "https://github.com/TelegramMessenger/tgcalls.git" "2faee3b5524f54d56c91c2058c00e11c656a74b3"
          clone_repo "Telegram/ThirdParty/kimageformats" "https://github.com/KDE/kimageformats.git"     "df82311a1081e576c4ac020204578bb8a81b21ec"
          clone_repo "Telegram/ThirdParty/kcoreaddons"   "https://github.com/KDE/kcoreaddons.git"       "fd84da51b554eac25e35b1e3f373edaab3029b15"
          clone_repo "Telegram/ThirdParty/cld3"          "https://github.com/google/cld3.git"           "b48dc46512566f5a2d41118c8c1116c4f96dc661"
          clone_repo "Telegram/ThirdParty/libprisma"     "https://github.com/desktop-app/libprisma.git" "23b0d70f9709da9b38561d5706891a134d18df76"
          clone_repo "Telegram/ThirdParty/MicroTeX"      "https://github.com/desktop-app/MicroTeX.git"  "61aaa7cc354de91d5898ffb0b2a6c62628d9a76f"
          clone_repo "Telegram/ThirdParty/TooManyCooks"  "https://github.com/tzcnt/TooManyCooks.git"    "b86af81982860c96295a7e95e4c60cb335615cef"

      - name: Patch prepare.py
        shell: cmd
        run: |
          powershell -Command "$c = Get-Content 'Telegram/build/prepare/prepare.py' -Raw; $c = $c -replace 'mingw-w64-x86_64-diffutils \^(\r?\n)?',''; $c = $c -replace 'https://github.com/msys2/msys2-installer/releases/download/2025-08-30/msys2-base-x86_64-20250830\.sfx\.exe','https://mirrors.aliyun.com/msys2/distrib/x86_64/msys2-base-x86_64-20250830.sfx.exe'; Set-Content 'Telegram/build/prepare/prepare.py' $c -NoNewline; Write-Output 'OK: diffutils removed, MSYS2 installer -> aliyun mirror'"

      - name: Prepare ThirdParty
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare
          set Platform=x64
          set QT=5.15.19
          set NUMBER_OF_PROCESSORS=2
          set CMAKE_BUILD_PARALLEL_LEVEL=2
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          python prepare.py silent 2>&1
          IF %ERRORLEVEL% NEQ 0 (
            ECHO prepare.py FAILED with errorlevel %ERRORLEVEL%
            exit /b %ERRORLEVEL%
          )
        timeout-minutes: 360

      - name: Trim prepared libraries for caching
        shell: bash
        run: |
          set +e
          LIBS="D:/a/testTele/Libraries"
          KEYS="$LIBS/win64/cache_keys"

          before=$(du -sm "$LIBS" 2>/dev/null | awk '{print $1}')
          echo "== Before: ${before:-?} MB =="
          df -h /d 2>/dev/null | tail -1

          # Tier 1a: the Qt source checkout is several GB and is never read by
          # the build (only Libraries/win64/Qt-5.15.19 is). The directory
          # itself has to survive, because prepare.py's checkCacheKey() treats
          # a missing directory as "rebuild this stage".
          if [ -f "$KEYS/qt_5.15.19" ] && [ -d "$LIBS/win64/qt_5.15.19" ]; then
            echo "== Tier 1a: emptying qt_5.15.19 =="
            find "$LIBS/win64/qt_5.15.19" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          else
            echo "== Tier 1a: skipped =="
          fi

          # Tier 1b: git metadata is read neither by the build nor by the
          # prepare cache keys.
          if [ -d "$LIBS/win64" ]; then
            echo "== Tier 1b: removing .git directories =="
            find "$LIBS/win64" -type d -name .git -prune -exec rm -rf {} +
          fi

          mid=$(du -sm "$LIBS" 2>/dev/null | awk '{print $1}')
          echo "== After tier 1: ${mid:-?} MB =="

          # Tier 2: ANGLE and OWT are consumed as prebuilt static libraries, so
          # their sources, their object files and their Release trees are dead
          # weight. Only the Debug *.lib files are linked.
          echo "== Tier 2: trimming tg_angle / tg_owt =="
          if [ -f "$KEYS/tg_angle" ] && [ -d "$LIBS/win64/tg_angle" ]; then
            find "$LIBS/win64/tg_angle" -mindepth 1 -maxdepth 1 \
              ! -name include ! -name out -exec rm -rf {} +
            find "$LIBS/win64/tg_angle/out" -mindepth 1 -maxdepth 1 \
              ! -name Debug -exec rm -rf {} +
            find "$LIBS/win64/tg_angle/out/Debug" -mindepth 1 -maxdepth 1 \
              ! -name '*.lib' ! -name '*.pdb' ! -name '*.a' -exec rm -rf {} +
          else
            echo "tg_angle trim skipped"
          fi
          if [ -f "$KEYS/tg_owt" ] && [ -d "$LIBS/win64/tg_owt" ]; then
            find "$LIBS/win64/tg_owt/out" -mindepth 1 -maxdepth 1 \
              ! -name Debug -exec rm -rf {} +
            find "$LIBS/win64/tg_owt/out/Debug" -mindepth 1 -maxdepth 1 \
              ! -name '*.lib' ! -name '*.pdb' ! -name '*.a' -exec rm -rf {} +
          else
            echo "tg_owt trim skipped"
          fi

          after=$(du -sm "$LIBS" 2>/dev/null | awk '{print $1}')
          echo "== After trim: ${after:-?} MB (was ${before:-?} MB) =="

          echo "== Largest remaining entries =="
          du -sh "$LIBS"/win64/* 2>/dev/null | sort -rh | head -15

          echo "== cache_keys present =="
          ls "$KEYS" 2>/dev/null | wc -l
          echo "== ThirdParty cache_keys present =="
          ls /d/a/testTele/ThirdParty/cache_keys 2>/dev/null | wc -l

      - name: Save Libraries cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: D:\a\testTele\Libraries
          key: ${{ steps.cache_libs.outputs.cache-primary-key }}

      - name: Verify Qt installed
        shell: cmd
        run: |
          IF NOT EXIST "%GITHUB_WORKSPACE%\..\Libraries\win64\Qt-5.15.19\lib\cmake\Qt5\Qt5Config.cmake" (
            ECHO Qt5Config.cmake NOT found at parent/Libraries/win64.
            EXIT /B 1
          )
          ECHO Qt5Config.cmake FOUND

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake -G "Ninja Multi-Config" -B "D:\out" -S "%GITHUB_WORKSPACE%" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -D TDESKTOP_API_ID=17349 -D TDESKTOP_API_HASH=344583e45741c457fe1862106095a5eb
          IF %ERRORLEVEL% NEQ 0 EXIT /B %ERRORLEVEL%
        timeout-minutes: 30

      - name: Verify build system generated
        shell: cmd
        run: |
          DIR D:\out\
          IF NOT EXIST D:\out\build.ninja (
            ECHO build.ninja NOT generated
            EXIT /B 1
          )
          ECHO build.ninja EXISTS
          FSUTIL volume diskfree D: || ECHO fsutil diskfree failed

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake --build "D:\out" --config Debug --parallel 2
          IF %ERRORLEVEL% NEQ 0 EXIT /B %ERRORLEVEL%
        timeout-minutes: 300

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: D:\out\Debug\Telegram.exe
          retention-days: 14
