name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      Platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show environment
        shell: cmd
        run: where python && python --version && echo Platform=%Platform% && dir Telegram\ThirdParty\

      - name: Prepare ThirdParty (silent)
        shell: cmd
        run: cd /d %GITHUB_WORKSPACE%\Telegram\build\prepare && set Platform=x64 && set QT=6.11.2 && python prepare.py silent --qt6 --skip-qt5 --skip-tg_owt --skip-breakpad --skip-openal-soft --skip-ffmpeg --skip-nv-codec-headers --skip-libwebp --skip-libjxl
        timeout-minutes: 150

      - name: Configure CMake
        shell: cmd
        run: set Platform=x64 && cmake -G "Visual Studio 17 2022" -A x64 -B out -S Telegram -DCMAKE_BUILD_TYPE=Debug -DTDESKTOP_API_ID=1096745 -DTDESKTOP_API_HASH=52593a113a1b765d31122f7d1ed0656f -DT_DISABLE_DEBUG_SKIPPING=ON
        working-directory: ${{ github.workspace }}

      - name: Build Telegram
        shell: cmd
        run: set Platform=x64 && cmake --build out --config Debug --target Telegram --parallel 2
        working-directory: ${{ github.workspace }}
        timeout-minutes: 300

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: ${{ github.workspace }}\out\Debug\*
          retention-days: 14
