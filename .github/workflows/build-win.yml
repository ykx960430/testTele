name: Windows Build

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      Platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show environment
        shell: powershell
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Python: $(python --version 2>&1)"
          Write-Host "CMake: $(cmake --version 2>&1 | Select-Object -First 1)"
          Write-Host "Ninja: $(ninja --version 2>&1)"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "RAM: $([math]::Round($os.FreePhysicalMemory / 1MB, 1)) GB free"
          Get-PSDrive C, D | Format-Table Name,
            @{N='Free(GB)';E={[math]::Round($_.Free/1GB,1)}},
            @{N='Used(GB)';E={[math]::Round($_.Used/1GB,1)}}

      - name: List repo structure
        shell: powershell
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\Telegram\build\prepare\prepare.py") {
            Write-Host "prepare.py FOUND"
          } else {
            Write-Host "prepare.py NOT FOUND"
            Get-ChildItem "$env:GITHUB_WORKSPACE\Telegram\build\" -Recurse -Name | Select-Object -First 20
          }
          Write-Host "---"
          Get-ChildItem "$env:GITHUB_WORKSPACE\Telegram\ThirdParty\" -Directory | Select-Object Name | Format-Table
          Write-Host "---"
          if (Test-Path "$env:GITHUB_WORKSPACE\Libraries") { Write-Host "Libraries exists" } else { Write-Host "Libraries MISSING" }

      - name: Prepare ThirdParty (silent)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/Telegram/build/prepare"
          export Platform=x64
          export QT=6.11.2
          echo "=== Starting prepare.py ==="
          python prepare.py silent --qt6 --skip-qt5 --skip-tg_owt --skip-breakpad --skip-openal-soft --skip-ffmpeg --skip-nv-codec-headers --skip-libwebp --skip-libjxl 2>&1
          EXIT_CODE=$?
          echo "=== prepare.py exit code: $EXIT_CODE ==="
          exit $EXIT_CODE
        timeout-minutes: 120

      - name: Configure CMake
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          export Platform=x64
          cmake -G "Visual Studio 17 2022" -A x64 -B out -S Telegram \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTDESKTOP_API_ID=1096745 \
            -DTDESKTOP_API_HASH=52593a113a1b765d31122f7d1ed0656f \
            -DT_DISABLE_DEBUG_SKIPPING=ON

      - name: Build Telegram
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          export Platform=x64
          cmake --build out --config Debug --target Telegram --parallel 2
        timeout-minutes: 300

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-Debug
          path: ${{ github.workspace }}/out/Debug/*
          retention-days: 14
